# SAOS — local/dev stack. Target: `docker compose up -d` brings up everything
# the current milestone needs. Staging: same file + docker-compose.staging.yml
# (see npm run staging:up). Production deploy lands in M23.
#
# IMPORTANT: data lives in NAMED VOLUMES only. This repo sits in a Dropbox
# folder — bind-mounting database or object-storage data would sync raw DB
# files to Dropbox (slow, corrupting, and a data-control problem). Never
# convert these to bind mounts.
#
# Image tags are PINNED (M21) to the exact versions this stack was verified
# against (digest-matched to the running containers). Upgrades are deliberate:
# bump the tag, run the stack + test suite, commit.

name: saos

services:
  postgres:
    image: postgres:16.14
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-saos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-saos_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-saos}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - saos_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saos} -d ${POSTGRES_DB:-saos}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [saos]

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-saos}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-saos_dev_password}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - saos_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [saos]

  # One-shot bucket bootstrap: creates the four private buckets and exits.
  # Buckets stay private — client documents are served only through the app,
  # which audit-logs every access (WISP requirement).
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set saos http://minio:9000 $${MINIO_ROOT_USER:-saos} $${MINIO_ROOT_PASSWORD:-saos_dev_password} &&
      mc mb --ignore-existing saos/saos-documents saos/saos-returns saos/saos-signed-docs saos/saos-recordings &&
      echo 'MinIO buckets ready.'
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-saos}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-saos_dev_password}
    networks: [saos]

  # Docuseal (self-hosted e-signatures — sign.sotoaccounting.com in prod).
  # SQLite storage inside its own volume; the API talks to it via
  # DOCUSEAL_MODE=http + DOCUSEAL_URL + an API token from its admin UI.
  docuseal:
    image: docuseal/docuseal:3.1.2
    restart: unless-stopped
    ports:
      - "${DOCUSEAL_PORT:-3002}:3000"
    volumes:
      - saos_docuseal_data:/data
    networks: [saos]

  # ── Meeting intelligence (profile: intel) ───────────────────────────────────
  # Sized for the shared Hetzner CPX41 16GB box (MP): Whisper 'small' (~1GB
  # resident) + a ~3B quantized LLM (~2-3GB). The API's job queue SERIALIZES
  # transcription/summarization so the two never peak together per job. Run
  # with: docker compose --profile intel up -d
  whisper:
    profiles: [intel]
    image: onerahmet/openai-whisper-asr-webservice:v1.9.1
    restart: unless-stopped
    environment:
      ASR_MODEL: ${WHISPER_MODEL:-small}
      ASR_ENGINE: faster_whisper
    ports:
      - "${WHISPER_PORT:-9010}:9000"
    volumes:
      - saos_whisper_cache:/root/.cache
    networks: [saos]

  ollama:
    profiles: [intel]
    image: ollama/ollama:0.31.1
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - saos_ollama_data:/root/.ollama
    networks: [saos]

  # ntfy — self-hosted push notifications (Brian + Jackson iPhones subscribe
  # to the alerts topic; access control configured at M23). Tiny image, so it
  # runs in the default profile.
  ntfy:
    image: binwiederhier/ntfy:v2.25.0
    restart: unless-stopped
    command: serve
    ports:
      - "${NTFY_PORT:-8093}:80"
    volumes:
      - saos_ntfy_data:/var/lib/ntfy
    networks: [saos]

  # ── Ops hardening (M21) ─────────────────────────────────────────────────────
  # Uptime Kuma — self-hosted uptime monitoring (status.sotoaccounting.com in
  # prod, internal-only). Monitors are configured in its UI on first boot;
  # the canonical monitor list lives in docs/RUNBOOK_OPS.md.
  uptime-kuma:
    image: louislam/uptime-kuma:2.4.0
    restart: unless-stopped
    ports:
      - "${UPTIME_KUMA_PORT:-3006}:3001"
    volumes:
      - saos_uptime_kuma_data:/app/data
    networks: [saos]

  # Vaultwarden — self-hosted password manager (vault.sotoaccounting.com in
  # prod). Funder-portal credentials migrate IN here at launch and the shared
  # Sheet gets purged (MP WISP). Signups are closed: accounts are created by
  # the admin via the admin panel (VAULTWARDEN_ADMIN_TOKEN; empty = admin
  # panel disabled). Needs HTTPS in front for WebAuthn — Caddy handles that
  # at M23; plain HTTP is fine for local evaluation.
  vaultwarden:
    image: vaultwarden/server:1.36.0
    restart: unless-stopped
    environment:
      SIGNUPS_ALLOWED: "false"
      INVITATIONS_ALLOWED: "true"
      ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN:-}
      DOMAIN: ${VAULTWARDEN_DOMAIN:-http://localhost:8094}
    ports:
      - "${VAULTWARDEN_PORT:-8094}:80"
    volumes:
      - saos_vaultwarden_data:/data
    networks: [saos]

  # ── Scheduling (profile: booking) — Cal.com self-hosted ─────────────────────
  # book.sotoaccounting.com in production. Shares the Postgres instance via
  # its own database (created by calcom-db-init). Event types (two-lane
  # booking, Zoom-only initial consultations) are configured in its admin UI
  # at M23; our webhook handler drives deposits + intake handoff.
  calcom-db-init:
    profiles: [booking]
    image: postgres:16
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      PGPASSWORD=$${POSTGRES_PASSWORD:-saos_dev_password} psql -h postgres -U $${POSTGRES_USER:-saos} -d postgres
      -tc \"SELECT 1 FROM pg_database WHERE datname = 'calcom'\" | grep -q 1 ||
      PGPASSWORD=$${POSTGRES_PASSWORD:-saos_dev_password} createdb -h postgres -U $${POSTGRES_USER:-saos} calcom;
      echo 'calcom database ready.'
      "
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-saos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-saos_dev_password}
    networks: [saos]

  calcom:
    profiles: [booking]
    image: calcom/cal.com:v6.2.0
    restart: unless-stopped
    depends_on:
      calcom-db-init:
        condition: service_completed_successfully
    ports:
      - "${CALCOM_PORT:-3003}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-saos}:${POSTGRES_PASSWORD:-saos_dev_password}@postgres:5432/calcom
      DATABASE_DIRECT_URL: postgresql://${POSTGRES_USER:-saos}:${POSTGRES_PASSWORD:-saos_dev_password}@postgres:5432/calcom
      NEXTAUTH_SECRET: ${CALCOM_NEXTAUTH_SECRET:-dev-calcom-nextauth-secret}
      CALENDSO_ENCRYPTION_KEY: ${CALCOM_ENCRYPTION_KEY:-dev-calcom-encryption-key}
      NEXT_PUBLIC_WEBAPP_URL: ${CALCOM_URL:-http://localhost:3003}
    networks: [saos]

  # ── Application services (placeholders) ─────────────────────────────────────
  # Wired now so the topology is visible; excluded from a default `up` via the
  # "app" profile. Dockerfiles land with their milestones (api: M4, portal: M15,
  # internal: M6+). Do not run `--profile app` until then.
  api:
    profiles: [app]
    build: ./apps/api
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks: [saos]

  portal:
    profiles: [app]
    build: ./apps/portal
    env_file: .env
    depends_on:
      - api
    networks: [saos]

  internal:
    profiles: [app]
    build: ./apps/internal
    env_file: .env
    depends_on:
      - api
    networks: [saos]

volumes:
  saos_pg_data:
  saos_minio_data:
  saos_docuseal_data:
  saos_whisper_cache:
  saos_ollama_data:
  saos_ntfy_data:
  saos_uptime_kuma_data:
  saos_vaultwarden_data:

networks:
  saos:
